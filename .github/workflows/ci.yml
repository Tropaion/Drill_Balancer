# CI for the firmware, the PC tools and the Android app. Each job runs one
# script from tools/ci, which runs the same way on a PC.
name: CI

# Every push runs, on any branch; a pull request from a branch of this repo
# shows that push run's checks on its head commit. There is no pull_request
# trigger, so pull requests from forks get no CI (fine for a one-person repo).
on:
  push:
    branches: ['**']
  workflow_dispatch:

# A new push to a branch cancels that branch's older run. Each run on main has
# a group of its own, so nothing cancels it: every main commit keeps its result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v7
      # Downloads of the component manager; the firmware build saves them.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Espressif/ComponentManager
          key: &components-key components-${{ hashFiles('firmware/dependencies.lock', 'tools/ci/versions.sh') }}
      - run: tools/ci/run_logged.sh tools/ci/firmware_host.sh
      - name: Upload the UI preview
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-preview
          path: firmware/test_host/ui_preview/out/*.png
          if-no-files-found: warn

  firmware-build:
    name: Firmware build (ESP-IDF v5.5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v7
      # Downloads of the component manager, for the lock's components and the
      # manager version (COMPONENT_MANAGER_VERSION in tools/ci/versions.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Espressif/ComponentManager
          key: *components-key
      - run: tools/ci/run_logged.sh tools/ci/firmware_build.sh
      - name: Upload the firmware
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            firmware/build-ci/drillbalancer.bin
            firmware/build-ci/sdkconfig
            firmware/build-ci/ci-build.log
            firmware/dependencies.lock
          if-no-files-found: warn

  simulator:
    name: Simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            firmware/tools/sim/requirements.txt
            firmware/tools/dataset/requirements.txt
      # This job saves the ESP-IDF subset cache, the others only restore it.
      - uses: ./.github/actions/idf-subset
        with:
          save: 'true'
      - run: tools/ci/run_logged.sh tools/ci/simulator.sh

  # The OTA tests with the image of this run's firmware build. A job of its own,
  # so the other simulator tests do not wait for the build.
  simulator-ota:
    name: Simulator OTA of the built image
    needs: firmware-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/tools/sim/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware
      # The artifact's root is firmware/ (the common folder of its files).
      - name: Put the image where the tests look for it
        run: |
          mkdir -p firmware/build
          cp "$RUNNER_TEMP/firmware/build-ci/drillbalancer.bin" firmware/build/drillbalancer.bin
      - uses: ./.github/actions/idf-subset
      - run: tools/ci/run_logged.sh tools/ci/simulator_ota.sh

  dataset:
    name: Dataset tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # bootstrap_repo.py --check-pin compares with the dataset-v1 tag
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # Only the dataset's requirements: dataset.sh installs just these, and
          # its own cache key keeps it apart from the simulator job's cache.
          cache-dependency-path: firmware/tools/dataset/requirements.txt
      - uses: ./.github/actions/idf-subset
      - run: tools/ci/run_logged.sh tools/ci/dataset.sh

  ci-scripts:
    name: CI script self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci/run_logged.sh tools/ci/test_ci.sh

  db-client:
    name: BLE client self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: tools/ci/run_logged.sh tools/ci/db_client.sh

  app:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: tools/ci/run_logged.sh tools/ci/app.sh
      - name: Upload the reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
            app/src/test/screenshots/*_compare.png
            app/src/test/screenshots/*_actual.png
          if-no-files-found: warn
