[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
datastore = "1.3.0"
coroutines = "1.11.0"
serialization = "1.12.0"
nordicBle = "2.11.0"
junit = "4.13.2"
androidxTestCore = "1.7.0"
espresso = "3.7.0"
robolectric = "4.17"
roborazzi = "1.77.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
